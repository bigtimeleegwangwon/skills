<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>214 부수 한자 학습 테스트</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+CJK+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); min-height: 100vh; padding: 20px; }
        .container { max-width: 1400px; margin: 0 auto; background: white; border-radius: 12px; padding: 40px; box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2); }
        h1 { text-align: center; color: #333; margin-bottom: 30px; font-size: 32px; font-weight: 600; letter-spacing: 1px; }
        .info { text-align: center; color: #999; margin-bottom: 40px; font-size: 14px; letter-spacing: 0.5px; }
        .grid { display: grid; grid-template-columns: repeat(10, 1fr); gap: 12px; margin-bottom: 30px; }
        .card { background: linear-gradient(135deg, #f5f7ff 0%, #ffffff 100%); border: 2px solid #e0e6f8; border-radius: 8px; padding: 16px; text-align: center; cursor: pointer; transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); min-height: 70px; display: flex; justify-content: center; align-items: center; }
        .card:hover { border-color: #667eea; background: linear-gradient(135deg, #e7f0ff 0%, #f5f7ff 100%); box-shadow: 0 8px 20px rgba(102, 126, 234, 0.2); transform: translateY(-2px); }
        .character { font-family: "Noto Serif CJK KR", serif; font-size: 48px; font-weight: 900; color: #333; line-height: 1; letter-spacing: -1px; }
        @media (max-width: 1200px) { .grid { grid-template-columns: repeat(9, 1fr); } .character { font-size: 44px; } }
        @media (max-width: 1024px) { .grid { grid-template-columns: repeat(8, 1fr); } .character { font-size: 40px; } }
        @media (max-width: 768px) { .grid { grid-template-columns: repeat(6, 1fr); } .character { font-size: 32px; } .container { padding: 20px; } }
        @media (max-width: 480px) { .grid { grid-template-columns: repeat(5, 1fr); gap: 8px; } .character { font-size: 24px; } .container { padding: 15px; } h1 { font-size: 24px; margin-bottom: 20px; } }
    </style>
</head>
<body>
    <div class="container">
        <h1>214 부수 한자 완전정복</h1>
        <div class="info">214개 부수를 순서대로 정렬했습니다.</div>
        <div id="content"></div>
    </div>

    <script>
        const radicals = [
            {char:"一"},{char:"丨"},{char:"丶"},{char:"丿"},{char:"乙"},{char:"亅"},{char:"二"},{char:"八"},{char:"十"},{char:"冫"},
            {char:"夕"},{char:"日"},{char:"曰"},{char:"月"},{char:"气"},{char:"辰"},{char:"雨"},{char:"風"},{char:"厂"},{char:"土"},
            {char:"山"},{char:"巛"},{char:"水"},{char:"田"},{char:"石"},{char:"谷"},{char:"里"},{char:"阜"},{char:"屮"},{char:"木"},
            {char:"瓜"},{char:"禾"},{char:"竹"},{char:"米"},{char:"艸"},{char:"韭"},{char:"麥"},{char:"麻"},{char:"黍"},{char:"牛"},
            {char:"犬"},{char:"禸"},{char:"羊"},{char:"羽"},{char:"虍"},{char:"虫"},{char:"角"},{char:"豕"},{char:"豸"},{char:"隹"},
            {char:"飛"},{char:"馬"},{char:"魚"},{char:"鳥"},{char:"鹵"},{char:"鹿"},{char:"黽"},{char:"鼠"},{char:"龍"},{char:"龜"},
            {char:"人"},{char:"儿"},{char:"口"},{char:"女"},{char:"子"},{char:"寸"},{char:"尢"},{char:"尸"},{char:"心"},{char:"手"},
            {char:"毛"},{char:"爪"},{char:"父"},{char:"牙"},{char:"疒"},{char:"皮"},{char:"目"},{char:"老"},{char:"而"},{char:"耳"},
            {char:"肉"},{char:"臣"},{char:"自"},{char:"舌"},{char:"色"},{char:"血"},{char:"見"},{char:"言"},{char:"足"},{char:"身"},
            {char:"面"},{char:"音"},{char:"頁"},{char:"首"},{char:"骨"},{char:"髟"},{char:"鼻"},{char:"齒"},{char:"入"},{char:"勹"},
            {char:"又"},{char:"夂"},{char:"夊"},{char:"廴"},{char:"廾"},{char:"彳"},{char:"攴"},{char:"支"},{char:"欠"},{char:"止"},
            {char:"癶"},{char:"立"},{char:"至"},{char:"舛"},{char:"行"},{char:"走"},{char:"辵"},{char:"隶"},{char:"鬥"},{char:"几"},
            {char:"凵"},{char:"刀"},{char:"力"},{char:"匕"},{char:"工"},{char:"干"},{char:"弋"},{char:"弓"},{char:"戈"},{char:"斗"},
            {char:"斤"},{char:"殳"},{char:"爿"},{char:"片"},{char:"玉"},{char:"瓦"},{char:"矛"},{char:"矢"},{char:"网"},{char:"耒"},
            {char:"聿"},{char:"貝"},{char:"車"},{char:"金"},{char:"鼓"},{char:"龠"},{char:"匚"},{char:"皿"},{char:"缶"},{char:"臼"},
            {char:"豆"},{char:"鬲"},{char:"鼎"},{char:"巾"},{char:"幺"},{char:"疋"},{char:"糸"},{char:"衣"},{char:"革"},{char:"韋"},
            {char:"黹"},{char:"甘"},{char:"酉"},{char:"食"},{char:"香"},{char:"鬯"},{char:"冂"},{char:"宀"},{char:"匸"},{char:"囗"},
            {char:"冖"},{char:"广"},{char:"戶"},{char:"穴"},{char:"邑"},{char:"門"},{char:"高"},{char:"亠"},{char:"卜"},{char:"卩"},
            {char:"厶"},{char:"士"},{char:"大"},{char:"小"},{char:"己"},{char:"彐"},{char:"彡"},{char:"文"},{char:"方"},{char:"无"},
            {char:"歹"},{char:"毋"},{char:"比"},{char:"氏"},{char:"火"},{char:"爻"},{char:"玄"},{char:"生"},{char:"用"},{char:"白"},
            {char:"示"},{char:"舟"},{char:"艮"},{char:"襾"},{char:"赤"},{char:"辛"},{char:"釆"},{char:"長"},{char:"靑"},{char:"非"},
            {char:"鬼"},{char:"黃"},{char:"黑"},{char:"齊"}
        ];

        const content = document.getElementById("content");
        let html = '<div class="grid">';
        radicals.forEach((radical, index) => {
            html += `<div class="card"><div class="character">${radical.char}</div></div>`;
        });
        html += "</div>";
        content.innerHTML = html;
    </script>
</body>
</html>
