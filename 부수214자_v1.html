        .container { max-width: 1400px; margin: 0 auto; background: white; border-radius: 12px; padding: 40px; box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2); }
        h1 { text-align: center; color: #333; margin-bottom: 30px; font-size: 32px; font-weight: 600; letter-spacing: 1px; }
        .info { text-align: center; color: #999; margin-bottom: 30px; font-size: 14px; letter-spacing: 0.5px; }
        .controls { display: flex; gap: 10px; justify-content: center; margin-bottom: 30px; flex-wrap: wrap; }
        .week-selector { display: flex; gap: 10px; align-items: center; }
        select, button { padding: 10px 20px; border: 2px solid #667eea; border-radius: 6px; font-size: 14px; cursor: pointer; transition: all 0.3s ease; background: white; color: #333; }
        button { background: #667eea; color: white; border-color: #667eea; }
        button:hover { background: #764ba2; border-color: #764ba2; transform: translateY(-2px); }
        .toggle-btn { background: #f39c12; border-color: #f39c12; }
        .toggle-btn:hover { background: #e67e22; border-color: #e67e22; }
        .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 12px; margin-bottom: 30px; }
        .card { background: linear-gradient(135deg, #f5f7ff 0%, #ffffff 100%); border: 2px solid #e0e6f8; border-radius: 8px; padding: 20px; text-align: center; cursor: pointer; transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); min-height: 140px; display: flex; flex-direction: column; justify-content: center; align-items: center; }
        .card:hover { border-color: #667eea; background: linear-gradient(135deg, #e7f0ff 0%, #f5f7ff 100%); box-shadow: 0 8px 20px rgba(102, 126, 234, 0.2); transform: translateY(-2px); }
        .card.revealed { background: #e7f3ff; border-color: #667eea; }
        .number { font-size: 12px; color: #999; margin-bottom: 8px; }
        .meaning { font-size: 16px; font-weight: bold; color: #333; margin-bottom: 6px; }
        .sound { font-size: 14px; color: #666; margin-bottom: 10px; }
        .character { font-family: "Noto Serif CJK KR", serif; font-size: 48px; font-weight: 900; color: #333; line-height: 1; letter-spacing: -1px; }
        .hidden { opacity: 0; pointer-events: none; }
        .stats { text-align: center; margin-top: 20px; padding: 15px; background: #f0f0f0; border-radius: 8px; color: #666; font-size: 14px; }
        .week-header { text-align: center; color: #667eea; margin: 20px 0 10px; font-size: 18px; font-weight: bold; }
        @media (max-width: 1200px) { .character { font-size: 44px; } }
        @media (max-width: 768px) { .container { padding: 20px; } h1 { font-size: 24px; margin-bottom: 20px; } .grid { grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); } .character { font-size: 36px; } }
        @media (max-width: 480px) { .grid { grid-template-columns: repeat(auto-fit, minmax(100px, 1fr)); gap: 8px; } .character { font-size: 28px; } .card { padding: 12px; min-height: 100px; } }

        let showCharacters = false;
        let currentWeek = "all";
        const weekSelect = document.getElementById("weekSelect");
        const toggleBtn = document.getElementById("toggleBtn");
        const resetBtn = document.getElementById("resetBtn");
        const content = document.getElementById("content");
        const stats = document.getElementById("stats");

        function getWeekRange(week) {
            if (week === "all") return [0, 213];
            const weekNum = parseInt(week);
            const start = (weekNum - 1) * 24;
            const end = Math.min(start + 24, 213);
            return [start, end];
        }

        function renderCards() {
            const [start, end] = getWeekRange(currentWeek);
            const weekRadicals = radicals.slice(start, end);
            let html = "";
            if (currentWeek !== "all") {
                const weekNum = parseInt(currentWeek);
                const startNum = start + 1;
                const endNum = end;
                html += `<div class="week-header">제${weekNum}주차 (${startNum}~${endNum}번)</div>`;
            }
            html += '<div class="grid">';
            weekRadicals.forEach(radical => {
                html += `<div class="card" data-num="${radical.num}">
                    <div class="number">#${radical.num}</div>
                    <div class="meaning">${radical.meaning}</div>
                    <div class="character hidden">${radical.char}</div>
                </div>`;
            });
            html += "</div>";
            content.innerHTML = html;
            updateStats(weekRadicals.length);
            document.querySelectorAll(".card").forEach(card => {
                card.addEventListener("click", function() {
                    const char = this.querySelector(".character");
                    if (char.classList.contains("hidden")) {
                        char.classList.remove("hidden");
                        this.classList.add("revealed");
                    } else {
                        char.classList.add("hidden");
                        this.classList.remove("revealed");
                    }
                });
            });
        }

        function updateStats(count) {
            stats.textContent = `현재: ${count}자 | 전체: 214자`;
        }

        function toggleCharacters() {
            showCharacters = !showCharacters;
            toggleBtn.textContent = showCharacters ? "한자 모두 숨기기" : "한자 모두 보기";
            document.querySelectorAll(".card").forEach(card => {
                const char = card.querySelector(".character");
                if (showCharacters) {
                    char.classList.remove("hidden");
                    card.classList.add("revealed");
                } else {
                    char.classList.add("hidden");
                    card.classList.remove("revealed");
                }
            });
        }

        weekSelect.addEventListener("change", (e) => {
            currentWeek = e.target.value;
            renderCards();
        });
        toggleBtn.addEventListener("click", toggleCharacters);
        resetBtn.addEventListener("click", () => {
            showCharacters = false;
            currentWeek = "all";
            toggleBtn.textContent = "한자 모두 보기";
            weekSelect.value = "all";
            renderCards();
        });
        renderCards();
    </script>

</html>
